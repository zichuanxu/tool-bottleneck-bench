[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bottleneckbench"
version = "0.1.0"
description = "A layer-interventional benchmark for diagnosing tool-using language agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Zichuan Xu", email = "xu.zichuan@ist.osaka-u.ac.jp"},
  {name = "Yuyang Dong", email = "dongyuyang@initial-s.com"},
  {name = "Makoto Onizuka", email = "onizuka@ist.osaka-u.ac.jp"},
  {name = "Chuan Xiao", email = "chuanx@ist.osaka-u.ac.jp"},
]
dependencies = ["dill==0.3.8", "matplotlib>=3.8,<4", "numpy>=1.26,<3"]

[project.scripts]
bottleneckbench = "bottleneckbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
